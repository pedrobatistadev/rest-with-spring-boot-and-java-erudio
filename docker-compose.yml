services:
  db:
    image: mysql:9.1.0
    #command: mysql --default_authentication_plugin=mysql_native_password
    restart: always
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: mikaelson22
      #MYSQL_USER: root
      MYSQL_PASSWORD: mikaelson22
      MYSQL_DATABASE: rest_with_spring_boot_erudio
    ports:
      - "3308:3306"
    expose:
      - 3306
    networks:
      - erudio-network
  rest-with-spring-boot-erudio:
    image: pedrobatistadev/rest-with-spring-boot-erudio
    restart: always
    build: ./rest-with-spring-boot-and-java-erudio
    working_dir: /rest-with-spring-boot-and-java-erudio
    environment:
      TZ: America/Sao_Paulo
      SPRING.DATASOURCE.URL: jdbc:mysql://db:3306/rest_with_spring_boot_erudio?usetimezone=true&servertimezone=utc
      SPRING.DATASOURCE.USERNAME: root
      SPRING.DATASOURCE.PASSWORD: mikaelson22
    command: mvn spring-boot:run
    ports:
      - 80:80
    depends_on:
      - db
    networks:
      - erudio-network
networks:
  erudio-network:
    driver: bridge